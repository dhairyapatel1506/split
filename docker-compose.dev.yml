# Local development dependencies only — the app itself runs on your machine
# with hot reload, while the stateful services run in containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split
      POSTGRES_DB: split
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dev-only DB admin UI — never ship this to production compose.
  # Login: server "postgres", user/password/db all "split".
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
