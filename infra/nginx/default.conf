# Nginx plays the role Vite's dev proxy played locally: one origin for the
# browser, /api forwarded to the API container. TLS is terminated here too
# once certificates exist (added during server setup).
server {
    listen 80;
    server_name _;

    # Reverse proxy: "api" resolves via Docker's network DNS. The variable
    # indirection forces per-request re-resolution so a recreated api
    # container (new IP) doesn't leave Nginx proxying into the void.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: /groups/<id> is a client-side route, not a file on
    # disk — unknown paths serve index.html and React Router takes over.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
