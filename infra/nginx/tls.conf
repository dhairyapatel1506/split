# Production vhost: mounted over the image's default.conf on the server,
# where Let's Encrypt certificates exist. The baked-in plain-HTTP config
# remains for environments without certificates.

server {
    listen 80;
    server_name split.dhairya.cloud;

    # ACME challenges must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name split.dhairya.cloud;

    ssl_certificate     /etc/letsencrypt/live/split.dhairya.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/split.dhairya.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Re-resolve the api container through Docker's DNS instead of caching
    # one IP at startup — a recreated api container gets a new address and
    # a static proxy_pass would keep 502ing at the old one.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
